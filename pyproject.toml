[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eccl"
version = "0.1.0"
description = "Evolved Chemistry CAD Lab — a modular workbench for materials, drug discovery, semiconductors, spectroscopy, and evolutionary molecular/material design."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Evolved Chemistry CAD Lab contributors" }]
keywords = [
    "chemistry", "materials-science", "drug-discovery", "semiconductor",
    "photonics", "plasmonics", "quantum", "spectroscopy", "cheminformatics",
    "evolutionary-algorithm", "cad",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
]

[project.optional-dependencies]
chem = ["rdkit>=2023.3"]
llm = ["httpx>=0.27"]
search = ["httpx>=0.27"]
all = ["rdkit>=2023.3", "httpx>=0.27"]
dev = ["pytest>=7", "rdkit>=2023.3", "httpx>=0.27"]

[project.scripts]
eccl = "eccl.cli:main"

[tool.setuptools.packages.find]
include = ["eccl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]
